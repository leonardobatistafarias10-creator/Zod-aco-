<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu Signo</title>

    <!-- Configuração do aplicativo -->
    <link rel="manifest" href="./manifest.json">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #4b0082, #6a5acd, #4169e1);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: white;
            padding: 30px 25px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        h1 {
            margin-top: 0;
            color: #4b0082;
            font-size: 32px;
        }

        p {
            color: #555;
            font-size: 17px;
        }

        input {
            width: 100%;
            padding: 15px;
            margin-top: 15px;
            border: 2px solid #ddd;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #6a5acd;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 15px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #6a5acd, #4169e1);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:active {
            transform: scale(0.98);
        }

        #resultado {
            margin-top: 25px;
            padding: 20px;
            border-radius: 18px;
            display: none;
            animation: aparecer 0.5s ease;
        }

        #resultado h2 {
            margin-top: 0;
            font-size: 28px;
        }

        #resultado p {
            color: white;
            font-size: 17px;
            line-height: 1.5;
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .aries {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
        }

        .touro {
            background: linear-gradient(135deg, #11998e, #38ef7d);
        }

        .gemeos {
            background: linear-gradient(135deg, #f7971e, #ffd200);
        }

        .cancer {
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .leao {
            background: linear-gradient(135deg, #f7971e, #ff512f);
        }

        .virgem {
            background: linear-gradient(135deg, #56ab2f, #a8e063);
        }

        .libra {
            background: linear-gradient(135deg, #ec008c, #fc6767);
        }

        .escorpiao {
            background: linear-gradient(135deg, #8e0e00, #1f1c18);
        }

        .sagitario {
            background: linear-gradient(135deg, #4776e6, #8e54e9);
        }

        .capricornio {
            background: linear-gradient(135deg, #232526, #414345);
        }

        .aquario {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
        }

        .peixes {
            background: linear-gradient(135deg, #7f00ff, #e100ff);
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🔮 Meu Signo</h1>

        <p>Digite seu signo para descobrir mais sobre ele:</p>

        <input
            type="text"
            id="signo"
            placeholder="Digite seu signo"
        >

        <button onclick="mostrarSigno()">
            Descobrir meu signo
        </button>

        <div id="resultado"></div>

    </div>

        // Ativar o aplicativo como PWA
        if ("serviceWorker" in navigator) {

            window.addEventListener("load", () => {

                navigator.serviceWorker.register("./sw.js")

                    .then(() => {
                        console.log("Aplicativo preparado!");
                    })

                    .catch((erro) => {
                        console.log("Erro:", erro);
                    });

            });
        }

    </script>

</body>

</html>
